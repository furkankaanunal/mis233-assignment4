name: Build LaTeX PDF
on:
  push:
    paths:
      - README.md
      - .github/workflows/build-latex.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install document build tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pandoc lmodern texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Generate complete LaTeX source from README
        run: |
          mkdir -p latex
          pandoc README.md --standalone --toc --listings -V geometry:margin=0.83in -V fontsize=10pt -V colorlinks=false -o latex/Destructuring_Field_Guide.tex
      - name: Build PDF from LaTeX source
        run: |
          cd latex
          pdflatex -interaction=nonstopmode -halt-on-error Destructuring_Field_Guide.tex
          pdflatex -interaction=nonstopmode -halt-on-error Destructuring_Field_Guide.tex
      - name: Commit LaTeX source and PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latex/Destructuring_Field_Guide.tex latex/Destructuring_Field_Guide.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build complete LaTeX field guide and PDF from README"
            git push origin HEAD:main
          fi
