name: Verify Assignment 4
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible clean install
        run: npm ci --no-audit --no-fund
      - name: Run all JavaScript, TypeScript and React examples
        run: npm run all > output.ci.txt
      - name: Verify output matches the captured submitted output
        run: diff -u output.txt output.ci.txt
      - name: Type-check strict TypeScript
        run: npm run check
      - name: Execute and compare additional experiments
        run: |
          node js/depth.mjs > depth.ci.txt
          diff -u depth-output.txt depth.ci.txt
